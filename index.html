let currentLang = 'neutro';
let currentAudio = null;
let currentCardId = null;
let currentProgressInterval = null;

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-neutro').classList.toggle('active', lang==='neutro');
  document.getElementById('btn-chileno').classList.toggle('active', lang==='chileno');
}

function buildPrompt(place, lang, isIntro) {
  const langInstr = lang === 'chileno'
    ? 'Escribe en español chileno informal y cercano. Usa expresiones chilenas naturales como "weon", "bacán", "filete", "la raja", "al tiro", "cacha que". Sé entretenido, directo y cercano como un amigo chileno contando la historia.'
    : 'Escribe en español neutro latinoamericano claro y ameno. Estilo de documental de viajes premium. Voz cálida, informativa y entretenida.';

  return `Eres una guía de audio de viaje premium. ${langInstr}

El grupo son 3 amigos chilenos de 40 años de viaje por Asia del 26 sep al 7 oct 2026. Van sin familia, disfrutando gastronomía, cultura y vida nocturna. Se hospedan en hoteles de lujo.

Contexto: ${place.context}

Crea una narración de audio de exactamente 7 minutos (900-1000 palabras) sobre: ${place.topic}

Estructura:
1. Frase de apertura poderosa que ubique al oyente con emoción
2. Historia y contexto histórico/cultural entretenido con datos sorprendentes
3. Mínimo 3 anécdotas o curiosidades que no todo el mundo sabe
4. Consejos prácticos específicos del lugar
5. Conexión con la experiencia de estar ahí con amigos a los 40
6. Cierre memorable y motivador

IMPORTANTE: Solo texto corrido para narración. Sin títulos, listas ni formato. Sin mencionar que eres IA. En segunda persona plural (ustedes).`;
}

async function generateScript(place, lang, isIntro) {
  const prompt = buildPrompt(place, lang, isIntro);
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!resp.ok) throw new Error('Claude API error');
  const data = await resp.json();
  return data.content[0].text;
}

async function generateAudio(text) {
  const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'xi-api-key': ELEVENLABS_API_KEY
    },
    body: JSON.stringify({
      text: text,
      model_id: 'eleven_multilingual_v2',
      voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true }
    })
  });
  if (!resp.ok) throw new Error('ElevenLabs API error');
  const blob = await resp.blob();
  return URL.createObjectURL(blob);
}

function stopCurrent() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentProgressInterval) { clearInterval(currentProgressInterval); currentProgressInterval = null; }
  if (currentCardId) resetCardUI(currentCardId);
  currentCardId = null;
}

function resetCardUI(cardId) {
  const card = document.getElementById('card-' + cardId);
  if (!card || card.classList.contains('done')) return;
  card.classList.remove('playing');
  const btn = card.querySelector('.play-btn');
  const dot = card.querySelector('.status-dot');
  const prog = card.querySelector('.progress-bar');
  const ctrl = card.querySelector('.audio-controls');
  const isIntro = card.classList.contains('intro-card');
  if (btn) { btn.disabled = false; btn.innerHTML = isIntro ? '&#9654; Escuchar intro de ciudad' : '&#9654; Escuchar guía'; btn.className = isIntro ? 'play-btn intro-play' : 'play-btn'; }
  if (dot) dot.className = 'status-dot dot-pending';
  if (prog) prog.classList.remove('visible');
  if (ctrl) ctrl.classList.remove('visible');
}

async function playAudio(placeId, placeData, isIntro) {
  const card = document.getElementById('card-' + placeId);
  const btn = card.querySelector('.play-btn');
  const dot = card.querySelector('.status-dot');
  const prog = card.querySelector('.progress-bar');
  const fill = card.querySelector('.progress-fill');
  const err = card.querySelector('.error-msg');
  const ctrl = card.querySelector('.audio-controls');
  const audioEl = card.querySelector('.audio-player');
  const scriptBox = card.querySelector('.script-box');
  const scriptText = card.querySelector('.script-text');

  if (currentCardId === placeId && currentAudio) { stopCurrent(); return; }
  stopCurrent();

  err.classList.remove('visible');
  btn.disabled = true;
  btn.className = 'play-btn loading';
  btn.innerHTML = '&#9203; Generando guión...';
  dot.className = 'status-dot dot-loading';
  card.classList.add('playing');
  currentCardId = placeId;

  try {
    const script = await generateScript(placeData, currentLang, isIntro);
    if (scriptText) scriptText.textContent = script;
    if (scriptBox) scriptBox.classList.add('visible');

    btn.innerHTML = '&#127908; Sintetizando voz...';
    const audioUrl = await generateAudio(script);

    const audio = new Audio(audioUrl);
    currentAudio = audio;
    prog.classList.add('visible');
    if (ctrl) { audioEl.src = audioUrl; ctrl.classList.add('visible'); }

    btn.className = isIntro ? 'play-btn speaking' : 'play-btn speaking';
    btn.innerHTML = '&#9646;&#9646; Pausar';
    btn.disabled = false;
    dot.className = 'status-dot dot-playing';

    currentProgressInterval = setInterval(() => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        if (fill) fill.style.width = pct + '%';
      }
    }, 500);

    audio.onended = () => {
      clearInterval(currentProgressInterval);
      if (fill) fill.style.width = '100%';
      card.classList.remove('playing');
      card.classList.add('done');
      btn.className = 'play-btn done-btn';
      btn.innerHTML = '&#10003; Completado';
      btn.disabled = true;
      dot.className = 'status-dot dot-done';
      currentAudio = null; currentCardId = null;
    };

    audio.onerror = () => {
      clearInterval(currentProgressInterval);
      resetCardUI(placeId);
      err.textContent = 'Error de reproducción.';
      err.classList.add('visible');
      currentAudio = null; currentCardId = null;
    };

    audio.play();

  } catch(e) {
    resetCardUI(placeId);
    err.textContent = 'Error: ' + e.message + '. Intenta de nuevo.';
    err.classList.add('visible');
    currentAudio = null; currentCardId = null;
  }
}

function toggleScript(placeId) {
  const box = document.getElementById('script-' + placeId);
  const btn = document.getElementById('toggle-' + placeId);
  if (!box) return;
  const v = box.classList.toggle('visible');
  btn.textContent = v ? '▲ Ocultar texto' : '▼ Ver texto del guía';
}

function buildUI() {
  const content = document.getElementById('content');
  CITIES.forEach(city => {
    const section = document.createElement('div');
    section.className = 'city-section';
    section.innerHTML = `
      <div class="city-header">
        <span class="city-flag">${city.city.split(' ')[0]}</span>
        <div><div class="city-name">${city.city.split(' ').slice(1).join(' ')}</div><div class="city-dates">${city.dates}</div></div>
      </div>
      <div class="cards"></div>`;
    content.appendChild(section);
    const cardsDiv = section.querySelector('.cards');

    const intro = city.intro;
    const iCard = document.createElement('div');
    iCard.className = 'intro-card'; iCard.id = 'card-' + intro.id;
    iCard.innerHTML = `
      <div class="intro-banner">
        <span class="intro-badge">Intro</span>
        <div><div class="intro-title">${intro.name}</div><div class="intro-sub">${intro.sub}</div></div>
        <div class="status-dot dot-pending" style="margin-left:auto"></div>
      </div>
      <div class="card-bottom">
        <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        <div class="audio-controls"><audio class="audio-player" controls></audio></div>
        <button class="play-btn intro-play" onclick='playAudio("${intro.id}", ${JSON.stringify(intro)}, true)'>&#9654; Escuchar intro de ciudad</button>
        <div class="error-msg"></div>
        <button class="script-toggle" id="toggle-${intro.id}" onclick="toggleScript('${intro.id}')">▼ Ver texto del guía</button>
        <div class="script-box" id="script-${intro.id}"><p class="script-text"></p></div>
      </div>`;
    cardsDiv.appendChild(iCard);

    city.places.forEach(place => {
      const badgeHtml = place.badge ? `<span class="badge badge-${place.badge}">${place.badgeLabel}</span>` : '';
      const pCard = document.createElement('div');
      pCard.className = 'place-card'; pCard.id = 'card-' + place.id;
      pCard.innerHTML = `
        <div class="card-top">
          <div class="place-icon" style="background:${place.color}20;border:1px solid ${place.color}40">${place.icon}</div>
          <div class="place-info">
            <div class="place-name">${place.name}${badgeHtml}</div>
            <div class="place-desc">${place.desc}</div>
            <div class="place-duration">Duración aprox: ${place.mins}</div>
          </div>
          <div class="status-dot dot-pending"></div>
        </div>
        <div class="card-bottom">
          <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
          <div class="audio-controls"><audio class="audio-player" controls></audio></div>
          <button class="play-btn" onclick='playAudio("${place.id}", ${JSON.stringify(place)}, false)'>&#9654; Escuchar guía</button>
          <div class="error-msg"></div>
          <button class="script-toggle" id="toggle-${place.id}" onclick="toggleScript('${place.id}')">▼ Ver texto del guía</button>
          <div class="script-box" id="script-${place.id}"><p class="script-text"></p></div>
        </div>`;
      cardsDiv.appendChild(pCard);
    });
  });
}

buildUI();
</script>
</body>
</html>
